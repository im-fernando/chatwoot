<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acesso Remoto</title>
    <script src="config.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --card: #f9fafb;
        --accent: #1f93ff;
        --accent-fg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151718;
          --fg: #ececee;
          --muted: #9ca3af;
          --border: #2c2e33;
          --card: #1c1e20;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter,
          Roboto, sans-serif;
      }

      .contact {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 14px;
      }

      .machine {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 10px;
      }

      .machine-name {
        font-weight: 600;
        margin-bottom: 10px;
      }

      .primary {
        display: inline-block;
        background: var(--accent);
        color: var(--accent-fg);
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-weight: 600;
      }

      .secondary {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        margin-left: 14px;
      }

      .secondary:hover {
        color: var(--fg);
      }

      .empty {
        color: var(--muted);
      }

      code {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main id="app" class="empty">Carregando…</main>

    <script>
      const CONFIG = window.REMOTE_ACCESS_CONFIG;
      const app = document.getElementById('app');

      // O node id do MeshCentral é base64 url-safe. Rejeitamos qualquer coisa
      // fora disso para não montar uma URL com lixo vindo do custom attribute.
      const NODE_ID_PATTERN = /^[A-Za-z0-9@$\-_]+$/;

      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      };

      // Aceita "nodeid" ou "Nome=nodeid", separados por vírgula quando o
      // cliente tem mais de uma máquina.
      const parseMachines = value =>
        String(value || '')
          .split(',')
          .map(entry => entry.trim())
          .filter(Boolean)
          .map(entry => {
            const separator = entry.indexOf('=');
            const name =
              separator === -1 ? '' : entry.slice(0, separator).trim();
            const rawId =
              separator === -1 ? entry : entry.slice(separator + 1).trim();
            return { name, id: rawId.replace(/^node\/\//, '') };
          })
          .filter(machine => NODE_ID_PATTERN.test(machine.id));

      const meshLink = (id, viewmode) =>
        `${CONFIG.meshUrl}/?viewmode=${viewmode}&gotonode=${encodeURIComponent(id)}`;

      const renderEmpty = contactName => {
        app.className = 'empty';
        app.replaceChildren(
          el(
            'p',
            null,
            `Nenhuma máquina vinculada${contactName ? ` a ${contactName}` : ''}.`
          ),
          el(
            'p',
            null,
            `Para vincular: instale o agente MeshCentral no computador do cliente, abra o dispositivo no MeshCentral, copie o valor de "gotonode" da barra de endereços e salve no atributo personalizado "${CONFIG.attributeKey}" deste contato.`
          )
        );
      };

      const renderMachines = (machines, contactName) => {
        app.className = '';
        const nodes = [];

        if (contactName) nodes.push(el('div', 'contact', contactName));

        machines.forEach((machine, index) => {
          const card = el('div', 'machine');
          card.append(
            el('div', 'machine-name', machine.name || `Máquina ${index + 1}`)
          );

          const desktop = el('a', 'primary', 'Acessar área de trabalho');
          desktop.href = meshLink(machine.id, 11);
          desktop.target = '_blank';
          desktop.rel = 'noopener noreferrer';
          card.append(desktop);

          [
            ['Terminal', 12],
            ['Arquivos', 13],
          ].forEach(([label, viewmode]) => {
            const link = el('a', 'secondary', label);
            link.href = meshLink(machine.id, viewmode);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            card.append(link);
          });

          nodes.push(card);
        });

        app.replaceChildren(...nodes);
      };

      const render = data => {
        const contact = data && data.contact;
        const contactName = (contact && contact.name) || '';
        const attributes = (contact && contact.custom_attributes) || {};
        const machines = parseMachines(attributes[CONFIG.attributeKey]);

        if (!machines.length) {
          renderEmpty(contactName);
          return;
        }

        renderMachines(machines, contactName);
      };

      window.addEventListener('message', event => {
        if (event.origin !== CONFIG.chatwootOrigin) return;

        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }

        if (payload.event !== 'appContext') return;
        render(payload.data);
      });

      // O Chatwoot já manda o appContext no load do iframe, mas se a aba
      // ainda não estava visível o evento é ignorado do lado dele.
      window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
    </script>
  </body>
</html>
